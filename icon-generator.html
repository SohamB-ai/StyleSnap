<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>StyleSnap Icon Generator</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f0f11;
      color: #f9fafb;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }
    h1 {
      font-size: 20px;
      margin-bottom: 8px;
    }
    p {
      color: #9ca3af;
      font-size: 13px;
      margin-bottom: 24px;
    }
    .grid {
      display: flex;
      gap: 24px;
      align-items: flex-end;
      background: #1a1a1f;
      padding: 24px;
      border-radius: 12px;
      border: 1px solid #2d2d35;
      margin-bottom: 24px;
    }
    .item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    canvas {
      image-rendering: pixelated;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }
    button {
      background: #4f46e5;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    button:hover {
      opacity: 0.9;
    }
    .download-all {
      background: #10b981;
      font-size: 14px;
      padding: 10px 20px;
    }
  </style>
</head>
<body>
  <h1>StyleSnap Icon Generator</h1>
  <p>Manifest V3 Chrome Extension Icon Generator (16px, 32px, 48px, 128px)</p>

  <div class="grid">
    <div class="item">
      <canvas id="c16" width="16" height="16"></canvas>
      <span>16x16</span>
      <button onclick="downloadIcon(16)">Save</button>
    </div>
    <div class="item">
      <canvas id="c32" width="32" height="32"></canvas>
      <span>32x32</span>
      <button onclick="downloadIcon(32)">Save</button>
    </div>
    <div class="item">
      <canvas id="c48" width="48" height="48"></canvas>
      <span>48x48</span>
      <button onclick="downloadIcon(48)">Save</button>
    </div>
    <div class="item">
      <canvas id="c128" width="128" height="128"></canvas>
      <span>128x128</span>
      <button onclick="downloadIcon(128)">Save</button>
    </div>
  </div>

  <button class="download-all" onclick="downloadAll()">Download All 4 Icons</button>

  <script>
    function drawIcon(canvasId, size) {
      const canvas = document.getElementById(canvasId);
      const ctx = canvas.getContext("2d");

      // Scale up for sharp rendering
      ctx.clearRect(0, 0, size, size);

      // Deep navy background #1E1B4B
      const radius = Math.round(size * 0.22);
      ctx.fillStyle = "#1E1B4B";
      ctx.beginPath();
      ctx.roundRect(0, 0, size, size, radius);
      ctx.fill();

      // S Curve
      const cx = size / 2;
      const cy = size / 2;
      const h_s = size * 0.72;
      const top = (size - h_s) / 2;
      const bot = top + h_s;
      const mid_y = size / 2;
      const w_s = size * 0.48;
      const stroke_w = Math.max(1.5, size * 0.14);

      ctx.strokeStyle = "#FFFFFF";
      ctx.lineWidth = stroke_w;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";

      ctx.beginPath();
      // Start top right
      ctx.moveTo(cx + w_s * 0.45, top + h_s * 0.12);
      // Curve to top
      ctx.bezierCurveTo(
        cx + w_s * 0.3, top,
        cx - w_s * 0.4, top,
        cx - w_s * 0.4, top + h_s * 0.26
      );
      // Curve to center
      ctx.bezierCurveTo(
        cx - w_s * 0.4, top + h_s * 0.44,
        cx + w_s * 0.45, top + h_s * 0.46,
        cx + w_s * 0.45, top + h_s * 0.68
      );
      // Curve to bottom left
      ctx.bezierCurveTo(
        cx + w_s * 0.45, bot,
        cx - w_s * 0.3, bot,
        cx - w_s * 0.45, bot - h_s * 0.12
      );
      ctx.stroke();

      // Center accent dot: #6366F1
      const dot_r = Math.max(1, size * 0.045);
      ctx.fillStyle = "#6366F1";
      ctx.beginPath();
      ctx.arc(cx, cy, dot_r, 0, Math.PI * 2);
      ctx.fill();
    }

    [16, 32, 48, 128].forEach(sz => drawIcon("c" + sz, sz));

    function downloadIcon(size) {
      const canvas = document.getElementById("c" + size);
      const a = document.createElement("a");
      a.download = `icon-${size}.png`;
      a.href = canvas.toDataURL("image/png");
      a.click();
    }

    function downloadAll() {
      [16, 32, 48, 128].forEach(sz => downloadIcon(sz));
    }
  </script>
</body>
</html>
